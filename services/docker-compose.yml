services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-flags:
    image: postgres:16-alpine
    container_name: postgres-flags
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flags_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_flags_data:/var/lib/postgresql/data
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/01-flags.sql:ro
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/02-targeting.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flags_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      PORT: "8001"
      DATABASE_URL: "postgres://postgres:postgres@postgres-auth:5432/auth_db?sslmode=disable"
      MASTER_KEY: "admin-secreto-123"
      OTEL_SERVICE_NAME: "auth-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    depends_on:
      postgres-auth:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8001:8001"

  flag-service:
    build:
      context: ./flag-service
      dockerfile: Dockerfile
    container_name: flag-service
    environment:
      PORT: "8002"
      DATABASE_URL: "postgres://postgres:postgres@postgres-flags:5432/flags_db?sslmode=disable"
      AUTH_SERVICE_URL: "http://auth-service:8001"
      OTEL_SERVICE_NAME: "flag-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    depends_on:
      postgres-flags:
        condition: service_healthy
      auth-service:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "8002:8002"

  targeting-service:
    build:
      context: ./targeting-service
      dockerfile: Dockerfile
    container_name: targeting-service
    environment:
      PORT: "8003"
      DATABASE_URL: "postgres://postgres:postgres@postgres-flags:5432/flags_db?sslmode=disable"
      AUTH_SERVICE_URL: "http://auth-service:8001"
      OTEL_SERVICE_NAME: "targeting-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    depends_on:
      postgres-flags:
        condition: service_healthy
      auth-service:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "8003:8003"

  evaluation-service:
    build:
      context: ./evaluation-service
      dockerfile: Dockerfile
    container_name: evaluation-service
    environment:
      PORT: "8004"
      REDIS_URL: "redis://redis:6379"
      FLAG_SERVICE_URL: "http://flag-service:8002"
      TARGETING_SERVICE_URL: "http://targeting-service:8003"
      SERVICE_API_KEY: "tm_key_local_service_123"
      AWS_REGION: "us-east-1"
      AWS_SQS_URL: ""
      AWS_ENDPOINT_URL: "http://dynamodb-local:8000"
      AWS_ACCESS_KEY_ID: "dummy"
      AWS_SECRET_ACCESS_KEY: "dummy"
      OTEL_SERVICE_NAME: "evaluation-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "8004:8004"

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    environment:
      PORT: "8005"
      AWS_REGION: "us-east-1"
      AWS_SQS_URL: ""
      AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
      AWS_ENDPOINT_URL: "http://dynamodb-local:8000"
      AWS_ACCESS_KEY_ID: "dummy"
      AWS_SECRET_ACCESS_KEY: "dummy"
      OTEL_SERVICE_NAME: "analytics-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    depends_on:
      dynamodb-local:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "8005:8005"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' > /tmp/prometheus.yml
        global:
          scrape_interval: 10s
        scrape_configs:
          - job_name: 'prometheus'
            static_configs:
              - targets: ['localhost:9090']
          - job_name: 'otel-collector-internal'
            static_configs:
              - targets: ['otel-collector:8888']
          - job_name: 'otel-collector-exporter'
            static_configs:
              - targets: ['otel-collector:8889']
        EOF
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin123"
      GF_PATHS_PROVISIONING: "/tmp/provisioning"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /tmp/provisioning/datasources /tmp/provisioning/dashboards /tmp/provisioning/plugins /tmp/provisioning/alerting /tmp/provisioning/access-control
        cat <<'EOF' > /tmp/provisioning/datasources/datasources.yaml
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://prometheus:9090
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            uid: loki
            url: http://loki:3100
            access: proxy
          - name: Jaeger
            type: jaeger
            uid: jaeger
            url: http://jaeger:16686
            access: proxy
        EOF
        exec /run.sh
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health_check
      - "8888:8888"   # métricas internas do collector
      - "8889:8889"   # exporter prometheus
    command: ["--config", "/etc/otel/otel-collector-config.yaml"]
    depends_on:
      - jaeger
      - loki
    restart: unless-stopped
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml


volumes:
  postgres_auth_data:
  postgres_flags_data:
