apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/claytonlfonseca/FIAP-Postech-Cloud.git'
    targetRevision: main
    path: k8s
    directory:
      recurse: true
      include: '*{auth}*'
      exclude: '{gateway/*,keda/*,secrets/*}'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: auth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
