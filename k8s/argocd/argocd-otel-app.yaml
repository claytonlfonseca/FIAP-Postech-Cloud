apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector-helm
  namespace: argocd

spec:
  project: default
  source:
    repoURL: 'https://open-telemetry.github.io/opentelemetry-helm-charts'
    chart: opentelemetry-collector
    targetRevision: '0.108.0'
    helm:
      releaseName: otel-collector
      values: |
        fullnameOverride: "otel-collector"
        mode: deployment
        replicaCount: 1
        image:
          repository: "otel/opentelemetry-collector-contrib"
        extraEnvsFrom:
          - secretRef:
              name: datadog-otel-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP
          jaeger-grpc:
            enabled: true
            containerPort: 14250
            servicePort: 14250
            protocol: TCP
          jaeger-thrift:
            enabled: true
            containerPort: 14268
            servicePort: 14268
            protocol: TCP
          zipkin:
            enabled: true
            containerPort: 9411
            servicePort: 9411
            protocol: TCP
          metrics:
            enabled: true
            containerPort: 8888
            servicePort: 8888
            protocol: TCP
          prom-exporter:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
                  cors:
                    allowed_origins:
                      - "*"
            jaeger:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:14250
                thrift_http:
                  endpoint: 0.0.0.0:14268
            zipkin:
              endpoint: 0.0.0.0:9411
            prometheus:
              config:
                scrape_configs:
                  - job_name: 'otel-collector'
                    scrape_interval: 10s
                    static_configs:
                      - targets: ['0.0.0.0:8888']

          processors:
            memory_limiter:
              check_interval: 5s
              limit_mib: 400
              spike_limit_mib: 100
            batch:
              timeout: 10s
              send_batch_size: 1024
            resource:
              attributes:
                - key: cluster.name
                  value: "togglemaster-eks"
                  action: upsert
                - key: environment
                  value: "dev"
                  action: upsert
                - key: deployment.environment
                  value: "dev"
                  action: upsert

          connectors:
            datadog/connector:
              traces:
                compute_stats_by_span_kind: true
                peer_tags_aggregation: true

          exporters:
            otlp/jaeger:
              endpoint: "jaeger-collector.monitoring.svc.cluster.local:4317"
              tls:
                insecure: true
            datadog:
              api:
                key: "${env:DD_API_KEY}"
                site: "${env:DD_SITE}"
              traces:
                span_name_as_resource_name: true
            prometheus:
              endpoint: "0.0.0.0:8889"
              resource_to_telemetry_conversion:
                enabled: true
            loki:
              endpoint: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            debug:
              verbosity: detailed
              sampling_initial: 100
              sampling_thereafter: 100

          extensions:
            health_check:
              endpoint: "0.0.0.0:13133"
            zpages:
              endpoint: "0.0.0.0:55679"
            pprof:
              endpoint: "0.0.0.0:17777"

          service:
            extensions: [health_check, zpages, pprof]
            pipelines:
              traces:
                receivers: [otlp, jaeger, zipkin]
                processors: [memory_limiter, resource, batch]
                exporters: [otlp/jaeger, datadog/connector, datadog, debug]
              metrics:
                receivers: [otlp, prometheus]
                processors: [memory_limiter, resource, batch]
                exporters: [prometheus, debug]
              metrics/datadog:
                receivers: [otlp, datadog/connector]
                processors: [memory_limiter, resource, batch]
                exporters: [datadog]
              logs:
                receivers: [otlp]
                processors: [memory_limiter, resource, batch]
                exporters: [loki, datadog, debug]
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
