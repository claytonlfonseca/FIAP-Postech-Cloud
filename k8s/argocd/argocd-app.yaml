apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/claytonlfonseca/FIAP-Postech-Cloud.git'
    targetRevision: main
    path: k8s
    directory:
      recurse: true
      exclude: '{argocd,argocd/*}'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true