apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation
  namespace: evaluation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation
  template:
    metadata:
      labels:
        app: evaluation
    spec:
      serviceAccountName: evaluation-service-account
      containers:
      - name: evaluation
        image: 197405022570.dkr.ecr.us-east-2.amazonaws.com/evaluation:v1.0.0-5da147d
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
        envFrom:
        - secretRef:
            name: evaluation-secrets
        - configMapRef:
            name: evaluation-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
