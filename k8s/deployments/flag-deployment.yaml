apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag
  namespace: flag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag
  template:
    metadata:
      labels:
        app: flag
    spec:
      containers:
      - name: flag
        image: 197405022570.dkr.ecr.us-east-2.amazonaws.com/flag:v1.0.0-5da147d
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
        envFrom:
        - secretRef:
            name: flag-secrets
        - configMapRef:
            name: flag-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
