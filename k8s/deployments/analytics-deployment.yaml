apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
      - name: analytics
        image: 197405022570.dkr.ecr.us-east-2.amazonaws.com/analytics:v1.0.0-5da147d
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8005
        envFrom:
        - secretRef:
            name: analytics-secrets
        - configMapRef:
            name: analytics-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      serviceAccountName: analytics-service-account
