apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting
  namespace: targeting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting
  template:
    metadata:
      labels:
        app: targeting
    spec:
      containers:
      - name: targeting
        image: 052005814846.dkr.ecr.us-east-1.amazonaws.com/targeting:wsl-20261108235716
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8003
        envFrom:
        - secretRef:
            name: targeting-secrets
        - configMapRef:
            name: targeting-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
