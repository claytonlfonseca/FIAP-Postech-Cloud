apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-service-monitor
  namespace: auth
  labels:
    app: auth
spec:
  selector:
    matchLabels:
      app: auth
  endpoints:
    - port: http
      interval: 30s
      path: /actuator/prometheus

